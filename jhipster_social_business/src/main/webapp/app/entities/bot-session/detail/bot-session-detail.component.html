<div class="d-flex justify-content-center">
  <div class="col-8">
    @if (botSession(); as botSessionRef) {
      <div>
        <h2 data-cy="botSessionDetailsHeading">
          <span jhiTranslate="whatsappProductServiceApp.botSession.detail.title">Bot Session</span>
        </h2>

        <hr />

        <jhi-alert-error></jhi-alert-error>

        <jhi-alert></jhi-alert>

        <dl class="row-md jh-entity-details">
          <dt><span jhiTranslate="global.field.id">ID</span></dt>
          <dd>
            <span>{{ botSessionRef.id }}</span>
          </dd>
          <dt>
            <span
              [ngbTooltip]="'whatsappProductServiceApp.botSession.help.waPhoneNumber' | translate"
              jhiTranslate="whatsappProductServiceApp.botSession.waPhoneNumber"
              >Wa Phone Number</span
            >
          </dt>
          <dd>
            <span>{{ botSessionRef.waPhoneNumber }}</span>
          </dd>
          <dt>
            <span
              [ngbTooltip]="'whatsappProductServiceApp.botSession.help.currentState' | translate"
              jhiTranslate="whatsappProductServiceApp.botSession.currentState"
              >Current State</span
            >
          </dt>
          <dd>
            <span>{{ botSessionRef.currentState }}</span>
          </dd>
          <dt>
            <span
              [ngbTooltip]="'whatsappProductServiceApp.botSession.help.sessionData' | translate"
              jhiTranslate="whatsappProductServiceApp.botSession.sessionData"
              >Session Data</span
            >
          </dt>
          <dd>
            <span>{{ botSessionRef.sessionData }}</span>
          </dd>
          <dt><span jhiTranslate="whatsappProductServiceApp.botSession.lastActiveAt">Last Active At</span></dt>
          <dd>
            <span>{{ botSessionRef.lastActiveAt | formatMediumDatetime }}</span>
          </dd>
        </dl>

        <button type="submit" (click)="previousState()" class="btn btn-info" data-cy="entityDetailsBackButton">
          <fa-icon icon="arrow-left"></fa-icon>&nbsp;<span jhiTranslate="entity.action.back">Back</span>
        </button>

        <button type="button" [routerLink]="['/bot-session', botSessionRef.id, 'edit']" class="btn btn-primary">
          <fa-icon icon="pencil-alt"></fa-icon>&nbsp;<span jhiTranslate="entity.action.edit">Edit</span>
        </button>
      </div>
    }
  </div>
</div>
